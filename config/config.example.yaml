# 全局配置模板
# 用法：复制为 config/config.yaml 后按实际环境修改
# config/config.yaml 已加入 .gitignore，不会被提交到仓库

env:
  # litemall 前台地址（Vue 项目使用 hash 路由，路径形如 /#/login）
  base_url: "http://127.0.0.1:6255"

browser:
  name: chrome
  # 是否无头运行，CI 环境改为 true
  headless: false
  window_size: "1440,900"

timeout:
  # 显式等待的默认超时时间（秒）
  default: 20
  # 轮询间隔（秒）
  poll: 0.5

account:
  # 被测环境的测试账号
  username: "your_username"
  password: "your_password"
  # 错误密码，用于登录失败用例
  wrong_password: "wrong_password"

paths:
  logs: logs
  screenshots: screenshots
  reports: reports
